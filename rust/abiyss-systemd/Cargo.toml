[package]
name = "abiyss-system-plane"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "ABIYSS Rust Linux system-plane daemon"

[[bin]]
name = "abiyss-system"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
