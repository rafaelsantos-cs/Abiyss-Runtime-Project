name: ABIYSS Runtime Multilang

on:
  push:
    branches: [runtime-multilang-v0.1]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov
      - name: Test Python runtime
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q src tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        working-directory: rust/abiyss-systemd
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust/abiyss-systemd
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        working-directory: rust/abiyss-systemd
        run: cargo test --all-targets --all-features
      - name: Release build
        working-directory: rust/abiyss-systemd
        run: cargo build --release

  python-native-client:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run system-plane client tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_system_plane.py tests/test_legacy_audit_regressions.py
