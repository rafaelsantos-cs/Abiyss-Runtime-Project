name: ABIYSS CI

on:
  push:
    branches: [main, warpigs-hardening, warpigs-sterile, warpigs-definitive]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install build/test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov build
      - name: Install ABIYSS
        run: python -m pip install --no-deps .
      - name: Compile
        run: python -m compileall -q src warpigs bindings/python
      - name: Test suite
        run: python -m pytest -q --cov=abiyss --cov-report=term-missing
      - name: Build wheel
        run: python -m build --wheel --no-isolation

  python-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Build native ABI
        run: |
          cmake -S native/warpigs -B build/warpigs-python -DCMAKE_BUILD_TYPE=Release
          cmake --build build/warpigs-python --target warpigs_core_shared --parallel
      - name: Run Python native smoke
        working-directory: bindings/python
        env:
          WARPIGS_NATIVE_LIB: ${{ github.workspace }}/build/warpigs-python/libwarpigs_core.so
        run: python smoke.py

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure C++ engine
        run: cmake -S native/warpigs -B build/warpigs -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ engine
        run: cmake --build build/warpigs --parallel
      - name: Run native tests
        run: ctest --test-dir build/warpigs --output-on-failure

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure ASan/UBSan build
        run: >-
          cmake -S native/warpigs -B build/warpigs-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build sanitizer targets
        run: cmake --build build/warpigs-sanitize --parallel
      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/warpigs-sanitize --output-on-failure

  native-thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure ThreadSanitizer build
        run: >-
          cmake -S native/warpigs -B build/warpigs-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=thread -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
      - name: Build TSan targets
        run: cmake --build build/warpigs-tsan --parallel
      - name: Run ThreadSanitizer tests
        env:
          TSAN_OPTIONS: halt_on_error=1:history_size=7
        run: ctest --test-dir build/warpigs-tsan --output-on-failure

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust supervisor
        working-directory: rust/warpigs-supervisor
        run: cargo test --all-targets --locked

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Build native ABI
        run: |
          cmake -S native/warpigs -B build/warpigs -DCMAKE_BUILD_TYPE=Release
          cmake --build build/warpigs --target warpigs_core_shared --parallel
      - name: Build Go C-ABI driver
        working-directory: bindings/go
        run: go build -v .
        env:
          CGO_ENABLED: '1'
      - name: Execute Go smoke
        working-directory: bindings/go
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/warpigs
        run: ./go

  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Build native ABI
        run: |
          cmake -S native/warpigs -B build/warpigs-julia -DCMAKE_BUILD_TYPE=Release
          cmake --build build/warpigs-julia --target warpigs_core_shared --parallel
      - name: Run Julia smoke
        env:
          WARPIGS_NATIVE_LIB: ${{ github.workspace }}/build/warpigs-julia/libwarpigs_core.so
        run: julia bindings/julia/smoke.jl

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build native ABI
        run: |
          cmake -S native/warpigs -B build/warpigs-dotnet -DCMAKE_BUILD_TYPE=Release
          cmake --build build/warpigs-dotnet --target warpigs_core_shared --parallel
      - name: Build C# tooling
        run: dotnet build bindings/csharp/WarPigs.csproj --configuration Release
      - name: Run C# smoke
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/warpigs-dotnet
        run: dotnet run --project bindings/csharp/WarPigs.csproj --configuration Release --no-build
