name: ABIYSS CI

on:
  push:
    branches: [main, warpigs-hardening, warpigs-sterile, warpigs-definitive]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install build/test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov build
      - name: Install ABIYSS
        run: python -m pip install --no-deps .
      - name: Compile
        run: python -m compileall -q src
      - name: Test suite
        run: python -m pytest -q --cov=abiyss --cov-report=term-missing
      - name: Build wheel
        run: python -m build --wheel --no-isolation

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++ engine
        run: cmake -S native/warpigs -B build/warpigs -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ engine
        run: cmake --build build/warpigs --parallel
      - name: Run native tests
        run: ctest --test-dir build/warpigs --output-on-failure

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust supervisor
        working-directory: rust/warpigs-supervisor
        run: cargo test --all-targets --locked
