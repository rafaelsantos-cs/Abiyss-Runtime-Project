name: ABIYSS CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install build/test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov build
      - name: Install ABIYSS
        run: python -m pip install --no-deps .
      - name: Compile
        run: python -m compileall -q src
      - name: Test suite
        run: python -m pytest -q --cov=abiyss --cov-report=term-missing
      - name: Build wheel
        run: python -m build --wheel --no-isolation
