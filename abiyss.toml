# Configuração do Abiyss (sem segredos — as chaves ficam no .env).
#
# Caminhos relativos são resolvidos a partir da pasta deste arquivo.
# Itens marcados "A CONFIRMAR" não puderam ser verificados na documentação
# oficial durante o desenvolvimento e precisam ser testados na VM com o
# NIM real (`abiyss testar-nim --modelo ...`).

[nim]
# Endpoint OpenAI-compatível do NVIDIA NIM hospedado.
base_url = "https://integrate.api.nvidia.com/v1"
# Segundos SEM receber nenhum byte antes de desistir (raciocínio longo demora).
timeout_leitura_segundos = 600
timeout_conexao_segundos = 15
# Máximo de bytes lidos de UMA resposta (com ou sem streaming); passou, a
# chamada falha. 16 MiB cobre com folga 32k tokens de saída em SSE.
max_bytes_resposta = 16777216
# Conexões HTTP ociosas guardadas por pool para reaproveitar.
max_conexoes_ociosas = 4

# ---------------------------------------------------------------------------
# Modelos. `extra` é copiado como está para o corpo da requisição.
# ---------------------------------------------------------------------------

[modelos.cerebro]
# GLM 5.3 — A CONFIRMAR o ID exato no catálogo do NIM (build.nvidia.com).
id = "z-ai/glm-5.3"
max_tokens = 32768
# Modo de raciocínio. Formato usado pelo NIM para a família GLM segundo
# fontes de terceiros — A CONFIRMAR. Se o modelo aceitar um nível de esforço
# (ex.: reasoning_effort = "max"), acrescente aqui.
extra = { chat_template_kwargs = { enable_thinking = true, clear_thinking = false } }

# ---------------------------------------------------------------------------
# Tabela de esforço. O kernel pensa em níveis abstratos (do mais leve ao mais
# pesado): minimal, low, medium, high, xhigh, ultra. Dois modos por cima:
#   raso     = minimal, low, medium
#   profundo = high, xhigh, ultra
# Cada modelo traduz cada nível para o que ele aceita:
#   pensar      = true/false  → grava no campo `campo_pensar` do corpo
#   orcamento   = N (tokens)  → grava no campo `campo_orcamento`
#   max_tokens  = N           → substitui o max_tokens do modelo
#   extra       = { ... }     → mesclado por cima do `extra` do modelo
#   usar_modelo = "<papel>"   → usa OUTRO modelo de [modelos] neste nível
#   a_confirmar = "..."       → PLACEHOLDER: capacidade não verificada no NIM.
#                               Nenhum campo do nível é enviado (pensar,
#                               orcamento, max_tokens, extra): vai só o modelo
#                               (ou o substituto) com os parâmetros padrão. O
#                               daemon avisa no log, uma vez por modelo, ao subir.
#                               Confirmou no NIM? Apague o a_confirmar.
# Campo vazio = o modelo não tem esse botão (usar `pensar`/`orcamento` nele
# é recusado ao carregar). Confira o resultado com `abiyss esforco`.
# Quem escolhe o nível: [chat] esforco_padrao/esforco_maximo, [daemon.esforco]
# (por situação do heartbeat), [subagentes.<nível>] esforco_padrao/
# esforco_maximo (+ o `esforco` opcional da delegação) e [sono] modo_esforco.
# Cada chamada grava o nível em chamadas_modelo; `abiyss status` mostra a
# latência por nível (para calibrar esforço × latência na VM).
# ---------------------------------------------------------------------------

[modelos.cerebro.esforco]
campo_pensar = "chat_template_kwargs.enable_thinking"
# GLM: nenhum orçamento de raciocínio documentado no NIM — A CONFIRMAR.
campo_orcamento = ""

[modelos.cerebro.esforco.niveis]
minimal = { pensar = false, max_tokens = 4096 }
low = { pensar = false }
medium = { pensar = true, max_tokens = 16384 }
high = { pensar = true }
# Sem orçamento conhecido, xhigh e ultra só diferem pelo esforço pedido.
xhigh = { pensar = true, a_confirmar = "GLM não tem orçamento de raciocínio conhecido; igual a high" }
ultra = { pensar = true, extra = { reasoning_effort = "max" }, a_confirmar = "o NIM aceita reasoning_effort = \"max\" para o GLM?" }

[modelos.sub_ultra]
# Kimi K3 — PLACEHOLDER: ID não encontrado; confirme no catálogo.
id = "moonshotai/kimi-k3"
max_tokens = 16384

[modelos.sub_ultra.esforco]
# Kimi: o raciocínio costuma ser um MODELO separado (variante "thinking"),
# não um campo — A CONFIRMAR para o K3. Sem botões por enquanto.
campo_pensar = ""
campo_orcamento = ""

[modelos.sub_ultra.esforco.niveis]
# Níveis rasos ficam com um modelo mais barato.
minimal = { usar_modelo = "sub_low", pensar = false }
low = { usar_modelo = "sub_medium", pensar = false }
medium = { usar_modelo = "sub_medium", pensar = true }
high = { a_confirmar = "Kimi K3: existe variante com raciocínio no NIM?" }
xhigh = { a_confirmar = "Kimi K3: existe variante com raciocínio no NIM?" }
ultra = { usar_modelo = "cerebro", pensar = true, extra = { reasoning_effort = "max" }, a_confirmar = "mesmo placeholder do cerebro.ultra" }

[modelos.sub_medium]
# GLM 5.3 Flash — A CONFIRMAR o ID exato.
id = "z-ai/glm-5.3-flash"
max_tokens = 8192

[modelos.sub_medium.esforco]
campo_pensar = "chat_template_kwargs.enable_thinking"
campo_orcamento = ""

[modelos.sub_medium.esforco.niveis]
minimal = { pensar = false, max_tokens = 2048 }
low = { pensar = false }
medium = { pensar = true }
high = { pensar = true, a_confirmar = "GLM Flash: sem orçamento conhecido; igual a medium" }
# Acima de high, o Flash cede a vez ao GLM completo.
xhigh = { usar_modelo = "cerebro", pensar = true }
ultra = { usar_modelo = "cerebro", pensar = true, extra = { reasoning_effort = "max" }, a_confirmar = "mesmo placeholder do cerebro.ultra" }

[modelos.sub_low]
# Nemotron 120b — A CONFIRMAR o ID exato.
id = "nvidia/nemotron-3-super-120b-a12b"
max_tokens = 8192

[modelos.sub_low.esforco]
# Nemotron 3: raciocínio por chat_template_kwargs — A CONFIRMAR o nome do
# campo; o orçamento de raciocínio (thinking budget) também.
campo_pensar = "chat_template_kwargs.enable_thinking"
campo_orcamento = ""

[modelos.sub_low.esforco.niveis]
minimal = { pensar = false, max_tokens = 1024, a_confirmar = "nome do campo de raciocínio do Nemotron 3" }
low = { pensar = false, a_confirmar = "nome do campo de raciocínio do Nemotron 3" }
medium = { pensar = true, a_confirmar = "nome do campo de raciocínio do Nemotron 3" }
high = { usar_modelo = "sub_medium", pensar = true }
xhigh = { usar_modelo = "cerebro", pensar = true }
ultra = { usar_modelo = "cerebro", pensar = true, extra = { reasoning_effort = "max" }, a_confirmar = "mesmo placeholder do cerebro.ultra" }

# ---------------------------------------------------------------------------
# Pools de chamadas. Cada pool tem a SUA chave (nome da variável no .env)
# e o SEU limite; um pool nunca usa a capacidade do outro.
#
# ATENÇÃO: ainda não está confirmado se o limite do NIM (40 req/min) é por
# CHAVE ou por CONTA. Relatos no fórum da NVIDIA indicam que é por conta.
# Se as duas chaves forem da mesma conta, divida o limite entre os pools
# (ex.: 25 + 15) para não tomar 429.
# ---------------------------------------------------------------------------

[pools.cerebro]
api_key_env = "NIM_API_KEY_CEREBRO"
requisicoes_por_minuto = 40
# 1 = sem rajadas: no máximo uma requisição a cada 60/40 = 1,5 s.
rajada = 1
# Fatia reservada para conversa com o usuário: o trabalho autônomo do
# daemon usa no máximo 40 - 10 = 30 req/min.
reserva_conversa_por_minuto = 10
# Máximo de chamadas esperando a vez neste pool (acima disso: erro na hora).
max_na_fila = 64

[pools.cerebro.retentativas]
max_tentativas = 5
backoff_inicial_ms = 2000
backoff_maximo_ms = 60000

[pools.subagentes]
api_key_env = "NIM_API_KEY_SUBAGENTES"
requisicoes_por_minuto = 40
rajada = 1
max_na_fila = 64

# Fila com prioridade Ultra > Medium > Low; máximo de chamadas simultâneas por nível.
[pools.subagentes.concorrencia]
ultra = 1
medium = 2
low = 3

[pools.subagentes.retentativas]
max_tentativas = 5
backoff_inicial_ms = 2000
backoff_maximo_ms = 60000

# ---------------------------------------------------------------------------
# Caminhos (relativos a esta pasta).
# ---------------------------------------------------------------------------

[caminhos]
# Dados locais; o banco SQLite fica em <dados>/abiyss.db.
dados = "data"
# Núcleo de identidade injetado no system prompt (o Abiyss não pode editá-lo).
identidade = "identity/nucleo.md"
# ÚNICA pasta onde as ferramentas de arquivo leem e escrevem. O kernel
# recusa iniciar se ela contiver kernel/, identity/, recursos/, data/,
# .env, .git, skills/ ou o abiyss.toml.
workspace = "workspace"
# Skills: cada subpasta com um SKILL.md (frontmatter `name` + `description`).
# Só nome e descrição vão para o system prompt; o texto completo é lido
# pela ferramenta `ler_skill`. Só leitura para o Abiyss. Pode apontar para
# uma pasta de skills do Hermes (pastas de categoria são aceitas).
skills = "skills"

# ---------------------------------------------------------------------------
# Skills: confiança das pastas e skills que o kernel usa sozinho.
# ---------------------------------------------------------------------------

[skills]
# Pastas de skills, em ordem (nome repetido: vale a da primeira pasta).
# Pasta DENTRO deste projeto (versionada no git) é confiável por padrão: ler
# uma skill dela não marca a conversa como conteúdo externo. Pasta de fora
# (skills do Hermes, hubs) é conteúdo EXTERNO para a regra dura da memória.
# Sem `raizes`, vale `[caminhos] skills` (uma pasta só).
# raizes = [
#   { caminho = "skills", confiavel = true },
#   { caminho = "/home/ubuntu/.hermes/skills", confiavel = false },
# ]

[skills.automaticas]
# Skills (confiáveis) que o kernel põe no contexto sozinho quando detecta a
# situação. Vazio = desligado.
estagnacao = "sair-de-loops"   # mesma decisão repetida sem efeito
sono = "dormir-bem"            # critério do sono (consolidação noturna)
despertar = "planejar-o-dia"   # primeiro ciclo depois do sono ou de um reinício

# ---------------------------------------------------------------------------
# Conversa (`abiyss chat`).
# ---------------------------------------------------------------------------

[chat]
# Quantas mensagens anteriores entram no contexto a cada turno.
historico_max_mensagens = 40
# Máximo de rodadas modelo → ferramenta → modelo por mensagem do usuário.
max_rodadas_ferramentas = 8
# Nível da tabela de esforço do cérebro em cada resposta.
esforco_padrao = "medium"
# Com a ferramenta `aprofundar`, o modelo pede um nível mais profundo para o
# resto de UMA resposta, até este teto (igual ao padrão = sem a ferramenta).
# high é o nível mais alto CONFIRMADO do cérebro; xhigh/ultra estão a confirmar.
esforco_maximo = "high"

# ---------------------------------------------------------------------------
# Ferramentas nativas de arquivo (ler/listar/escrever dentro do workspace).
# ---------------------------------------------------------------------------

[ferramentas]
max_bytes_leitura = 200000
max_bytes_escrita = 1000000
max_itens_listagem = 500

# ---------------------------------------------------------------------------
# Memória de longo prazo: um cofre do Obsidian com dois escopos.
#   01_internal/  pessoas, preferências, auto-modelo, diário, procedimentos
#   02_external/  mapa de fontes (links canônicos, nível de navegador,
#                 revalidar_apos, resumos sempre datados)
# O modelo só PROPÕE (memoria_propor); `abiyss sleep` aplica ou rejeita.
# Conteúdo vindo de ferramentas/web nunca entra em 01_internal (regra do kernel).
# ---------------------------------------------------------------------------

[memoria]
# Pasta do cofre (fora do git: tem dados pessoais). Na VM, pode apontar
# para um cofre do Obsidian que já existe.
cofre = "cofre"
max_resultados = 8
max_bytes_nota = 200000
max_bytes_proposta = 20000
# Memória central: arquivo PEQUENO injetado no system prompt em todo turno
# (conversa e heartbeat), ao lado do núcleo. Entradas separadas por "§",
# cada uma marcada [dito] ou [deduzido]. Fora do git (dados pessoais).
central = "identity/memoria-central.md"
# Orçamento em caracteres. Escrita que passaria do limite é RECUSADA e
# relatada (nunca cortada). O Hermes usava ~2200 (MEMORY.md) + ~1375 (USER.md).
limite_central_caracteres = 4000

# Busca: o qmd (servidor MCP HTTP, em [[mcp.servidores]] abaixo) é o motor de
# memoria_buscar quando está no ar; senão, busca por texto simples no cofre.
[memoria.qmd]
# Nome do servidor qmd em [[mcp.servidores]]. Vazio = nunca usar o qmd.
servidor = "qmd"
# Ferramenta de busca. Vazio = a primeira que existir entre search,
# qmd_search, query, qmd_query, vsearch, qmd_vsearch — A CONFIRMAR na VM
# (`abiyss ferramentas` com expor = true mostra os nomes).
ferramenta = ""
# Coleções do qmd que indexam cada escopo (opcional, recomendado):
#   qmd collection add <cofre>/01_internal --name abiyss-interno
#   qmd collection add <cofre>/02_external --name abiyss-externo
# Vazias = uma busca só, e o kernel separa os escopos pelo caminho.
colecao_interna = ""
colecao_externa = ""

# ---------------------------------------------------------------------------
# Daemon (`abiyss daemon`): heartbeat e crons.
# ---------------------------------------------------------------------------

[daemon]
# Intervalo entre ciclos de heartbeat. Cada ciclo faz no máximo UMA chamada
# ao modelo — e nenhuma se não houver novidade.
heartbeat_segundos = 300
# Verificação de crons (código puro, não chama o modelo).
cron_verificacao_segundos = 30
# Sem eventos novos e sem mudança no goal em foco, o modelo só é chamado de
# novo depois deste tempo.
revisao_minima_segundos = 1800
# Máximo de eventos da fila colocados no contexto de um ciclo.
max_eventos_por_ciclo = 20
# Watchdog do systemd (WatchdogSec= na unit): se o loop principal ficar
# este tempo sem dar uma volta, o daemon para de avisar o systemd, que o
# reinicia. O loop não espera trabalho longo (ciclo, sono, manutenção e o
# VACUUM completo da 1ª manutenção rodam fora dele; o ciclo tem o seu
# próprio limite logo abaixo): uma volta normal leva milissegundos, e o pior
# caso auditado são alguns comandos no banco esperando o busy_timeout de 5 s.
max_travado_segundos = 300
# Tempo máximo de UM ciclo de heartbeat. Passou disto, o kernel interrompe o
# ciclo, registra o erro e os eventos continuam pendentes. O loop principal
# (crons, sinal de vida, watchdog) nunca espera o ciclo: ele anda em paralelo.
max_duracao_ciclo_segundos = 900
# Um ciclo que deixa algo para o próximo ler (ex.: consultar_skill) antecipa
# o ciclo seguinte para daqui a `continuacao_segundos`, no máximo
# `max_continuacoes_seguidas` vezes em sequência.
continuacao_segundos = 20
max_continuacoes_seguidas = 2
# Ao subir depois de ficar fora do ar mais que isto (queda ou parada), o
# daemon publica um evento kernel/reinicio com o tempo de ausência; o primeiro
# ciclo recebe a skill planejar-o-dia.
aviso_ausencia_minutos = 10

# Esforço do cérebro em cada situação do heartbeat: um modo ("raso" = medium,
# "profundo" = high) ou um nível exato (minimal..ultra). Num ciclo com mais
# de uma situação, vale a mais profunda.
[daemon.esforco]
# Ciclos comuns: eventos (cron, relatório de sub-agente, resposta do dono,
# skill consultada) ou um goal que mudou.
rotina = "raso"
# Revisão periódica do goal em foco (e o primeiro ciclo com um goal).
revisao_goal = "profundo"
# O ciclo traz um aviso kernel/estagnacao (com a skill sair-de-loops).
estagnacao = "profundo"
# Planejar o dia ao acordar: o resumo do sono ou um kernel/reinicio.
despertar = "profundo"

# ---------------------------------------------------------------------------
# Ritmo do dia (fuso local da máquina; o systemd define TZ=America/Sao_Paulo).
#   vigília  = dentro das horas ativas: heartbeat normal;
#   descanso = fora delas: sem revisão periódica de goal; eventos e mudanças
#              de goal ainda acordam o modelo; heartbeat mais espaçado;
#   sono     = a consolidação noturna está rodando (heartbeat pausado).
# ---------------------------------------------------------------------------

[ritmo]
# "HH:MM-HH:MM"; pode cruzar a meia-noite ("22:00-06:00").
# Início igual ao fim ("00:00-00:00") = vigília o dia inteiro.
horas_ativas = "07:00-23:00"
heartbeat_descanso_segundos = 1800

# ---------------------------------------------------------------------------
# Orçamento diário do trabalho AUTÔNOMO (heartbeat + sub-agentes + sono),
# contado no fuso local desde a meia-noite. Cada tentativa conta. A conversa
# com o dono (`abiyss chat`) NUNCA entra nesta conta nem é cortada por ela.
#   >= fracao_alerta  → só eventos acordam o modelo (sem revisão periódica);
#   esgotado          → o heartbeat não chama o modelo e não delega até amanhã.
# 0 = sem limite. Valores A CALIBRAR na VM com o uso real.
# ---------------------------------------------------------------------------

[orcamento]
chamadas_autonomas_por_dia = 1500
tokens_autonomos_por_dia = 0
# Fatia que só o sono pode usar (o heartbeat e os sub-agentes param antes).
reserva_sono_chamadas = 12
fracao_alerta = 0.8

# ---------------------------------------------------------------------------
# Vigilância do heartbeat (código, sem modelo).
# Estagnação: a mesma decisão (goal em foco + ações normalizadas) em
# `repeticoes_estagnacao` ciclos seguidos sem o goal mudar, ou a mesma ação
# falhando `erros_mesma_acao` vezes seguidas → evento kernel/estagnacao (com a
# skill sair-de-loops) e a revisão periódica do goal fica 2×, 4×... até
# `max_multiplicador_revisao`× mais espaçada, até ele mudar.
# Disjuntor: `falhas_para_abrir` ciclos seguidos com falha do modelo (erro,
# resposta fora do formato, ciclo interrompido) → sem chamadas por
# min(base·2^k, teto) segundos (±20%); depois UMA tentativa decide.
# O estado aparece em `abiyss status` e no `--verificar`.
# ---------------------------------------------------------------------------

[vigilancia]
repeticoes_estagnacao = 3
erros_mesma_acao = 3
max_multiplicador_revisao = 8
falhas_para_abrir = 3
disjuntor_base_segundos = 300
disjuntor_teto_segundos = 3600

# ---------------------------------------------------------------------------
# Pedidos ao usuário (caixa de entrada assíncrona). O heartbeat pede com a
# ação pedir_ao_usuario; as perguntas do sono também viram pedidos. Você
# responde com `abiyss pedidos responder <id> "texto"` ou na conversa (o
# Abiyss registra com responder_pedido). A resposta chega como evento.
# ---------------------------------------------------------------------------

[pedidos]
# Teto de pendentes; a mesma pergunta pendente não duplica.
max_pendentes = 10
# Sem resposta depois disto, o pedido expira (e o Abiyss é avisado).
expira_apos_horas = 72

# ---------------------------------------------------------------------------
# Backup (feito no início de cada sono; `abiyss backup` faz na hora).
# Vai para <dados>/backups/AAAA-MM-DD/: banco (VACUUM INTO, consistente
# mesmo com o daemon rodando), cofre, memória central e núcleo. Links
# simbólicos não são seguidos. Restaurar é manual: veja docs/SONO.md.
# Para ter cópia FORA da VM, use um timer do systemd com rsync/rclone.
# ---------------------------------------------------------------------------

[backup]
ativo = true
manter_diarios = 7
# Além dos diários, quantos domingos anteriores guardar.
manter_semanais = 4
# Abaixo disto de disco livre, o backup é pulado (com aviso).
disco_minimo_gb = 2.0
# Cofre maior que isto não é copiado (o banco ainda é).
max_megabytes_cofre = 2048

# ---------------------------------------------------------------------------
# Sono: uma vez por dia o daemon pausa o heartbeat e consolida a memória
# (backup → aplica a fila → revisão do dia pelo modelo em DUAS passadas
# separadas por origem: interna e externa → aplica → relatório em
# <dados>/sono/ e um evento `sono` para o primeiro ciclo depois).
# Toda proposta do sono cita evidências; o kernel descarta o resto.
# `abiyss sleep --completo` dorme na hora; `abiyss sleep --relatorio` mostra
# o último relatório. Detalhes em docs/SONO.md.
# ---------------------------------------------------------------------------

[sono]
ativo = true
# Início da janela (fuso local). Um sono antes do meio-dia revisa o dia anterior.
inicio = "03:00"
janela_minutos = 120
# Perdeu a janela (VM desligada)? Dorme assim que subir, até este limite.
recuperar_ate_horas = 12
# Tempo máximo do sono inteiro (o daemon interrompe e registra a falha).
max_duracao_minutos = 60
# Modo da tabela de esforço do cérebro em cada passada.
modo_esforco = "profundo"
modo_esforco_externo = "raso"
# Teto de chamadas ao modelo por noite (uma fica para a passada externa
# quando há material externo). O que não couber fica para a próxima noite.
max_chamadas = 4
max_caracteres_por_chamada = 120000
# Teto de propostas por noite (as duas passadas juntas).
max_propostas = 30
# Notas internas relacionadas ao material do dia mandadas junto (replay).
max_notas_relacionadas = 8

# ---------------------------------------------------------------------------
# Sub-agentes (executados pelo daemon). Cada um roda com contexto limpo,
# ferramentas do seu nível e orçamento próprio; nunca cria outro sub-agente
# (delegar/status/cancelar não são dadas a eles, independente desta lista).
# As mãos (servidores MCP terminal, web_rapido e ambiente) entram por aqui:
# é pela delegação que o heartbeat as usa. Ler a web e rodar comandos NUNCA
# ficam no mesmo nível: uma página poderia mandar o sub-agente ler um arquivo
# (ou rodar um programa) e buscar uma URL do atacante com o conteúdo
# (docs/LIMITES.md). Pesquisa na web: ultra ou low. Comandos: medium. O low
# continua só de leitura (sem escrever_arquivo e sem o terminal).
# ---------------------------------------------------------------------------

[subagentes]
# Intervalo para procurar pedidos feitos por outros processos (ex.: chat).
verificacao_segundos = 5
# Máximo de sub-agentes vivos ao mesmo tempo (todos os níveis).
max_simultaneos = 4

# esforco_padrao/esforco_maximo: nível da tabela de esforço do modelo do
# sub-agente quando a delegação não pede um, e o teto do que ela pode pedir
# (acima disso é limitado). O teto impede um nível barato de subir para o
# modelo de um nível acima (ex.: sub_low.high usa o sub_medium).
[subagentes.ultra]
max_tokens = 200000
max_segundos = 1800
max_rodadas = 20
esforco_padrao = "high"
esforco_maximo = "ultra"
ferramentas = [
  "ler_arquivo", "listar_arquivos", "escrever_arquivo", "exemplo__*",
  "web_rapido__*", "ambiente__*",
]

[subagentes.medium]
max_tokens = 100000
max_segundos = 900
max_rodadas = 12
esforco_padrao = "medium"
esforco_maximo = "high"
ferramentas = [
  "ler_arquivo", "listar_arquivos", "escrever_arquivo", "exemplo__*",
  "terminal__*", "ambiente__*",
]

[subagentes.low]
max_tokens = 50000
max_segundos = 600
max_rodadas = 8
esforco_padrao = "low"
esforco_maximo = "medium"
ferramentas = ["ler_arquivo", "listar_arquivos", "exemplo__*", "web_rapido__*", "ambiente__*"]

# ---------------------------------------------------------------------------
# Servidores MCP. Dois tipos:
# - processo filho (stdio): `comando` + `args` (recursos em Python, em
#   recursos/). Recebem um ambiente limpo: as chaves do NIM NÃO são repassadas.
# - HTTP "streamable": `url` de um servidor que já está rodando (ex.: qmd).
#   Token, se precisar, só por variável de ambiente: `token_env = "NOME"`.
# As ferramentas aparecem como <nome>__<ferramenta>; `expor = false` esconde
# do modelo (só o kernel usa).
# ---------------------------------------------------------------------------

[mcp]
# Na primeira execução o uv pode precisar baixar dependências.
timeout_inicio_segundos = 120
# Supervisão (só no daemon): a cada N segundos, servidor que caiu, que
# estourou uma chamada (timeout_segundos), que passou de max_memoria_mb
# (processo + descendentes: o `uv` e o Python) ou de max_vida_segundos é
# morto — o grupo de processos inteiro — e sobe de novo.
supervisao_segundos = 30
max_memoria_mb = 512
# 0 = sem limite de tempo de vida.
max_vida_segundos = 0
# Resultado de ferramenta maior que isto é cortado (com aviso no texto).
max_bytes_resultado = 1000000

[[mcp.servidores]]
nome = "exemplo"
comando = "uv"
args = ["run", "--frozen", "--quiet", "servidor.py"]
diretorio = "recursos/mcp/exemplo"
timeout_segundos = 60
ativo = true

[[mcp.servidores]]
# qmd: busca em Markdown (BM25/vetores) sobre o cofre. Já roda na VM; o
# kernel só conecta. Fora do ar = memoria_buscar usa busca por texto.
# A CONFIRMAR: o caminho /mcp do endpoint HTTP do qmd.
nome = "qmd"
url = "http://localhost:8181/mcp"
timeout_segundos = 30
# Só o kernel usa (por trás de memoria_buscar, que respeita os escopos).
expor = false
ativo = true

[[mcp.servidores]]
# terminal: comandos de shell numa caixa de areia (bubblewrap). Só o
# workspace é gravável (em /workspace); sistema só leitura; sem rede por
# padrão. Precisa do bwrap e de namespaces de usuário: sem isso o servidor
# NÃO sobe (o motivo vai para o journal). Instalação e limites em
# recursos/mcp/terminal/README.md.
nome = "terminal"
comando = "uv"
args = ["run", "--frozen", "--quiet", "--no-dev", "servidor.py"]
diretorio = "recursos/mcp/terminal"
# Tempo do KERNEL para uma chamada. O servidor recusa subir se
# TERMINAL_TIMEOUT_MAXIMO + 5 s não couber aqui.
timeout_segundos = 120
ativo = true

[mcp.servidores.env]
# Limites de cada comando (valores SEMPRE entre aspas). O servidor confere
# que cabem nos do kernel: concorrentes × memória + 128 MiB do próprio
# servidor ≤ [mcp] max_memoria_mb, e 2 × saída ≤ [mcp] max_bytes_resultado.
TERMINAL_TIMEOUT_PADRAO = "30"
TERMINAL_TIMEOUT_MAXIMO = "110"
TERMINAL_MAX_SAIDA_BYTES = "32000"   # por fluxo (stdout e stderr): começo e fim
TERMINAL_MAX_CONCORRENTES = "2"
TERMINAL_MEMORIA_MB = "160"          # por comando (cada processo e a árvore toda)
TERMINAL_MAX_PROCESSOS = "64"        # processos + threads por comando
TERMINAL_REDE = "nao"                # "sim" também abre os serviços locais (qmd, SearXNG)

[[mcp.servidores]]
# web_rapido: a camada rápida de pesquisa, sem modelo. Busca num SearXNG
# local e lê páginas (texto principal, pelo trafilatura). Respeita o
# robots.txt, espera entre pedidos ao mesmo site e recusa endereços da rede
# interna (inclusive o metadata da nuvem). Cache em data/web_rapido/. A
# busca precisa do SearXNG rodando (recursos/mcp/web_rapido/README.md);
# ler_pagina funciona sem ele.
nome = "web_rapido"
comando = "uv"
args = ["run", "--frozen", "--quiet", "--no-dev", "servidor.py"]
diretorio = "recursos/mcp/web_rapido"
timeout_segundos = 60
ativo = true

[mcp.servidores.env]
WEB_SEARXNG_URL = "http://127.0.0.1:8888"
WEB_PRAZO_SEGUNDOS = "50"              # por chamada; + 8 s de folga ≤ timeout_segundos
WEB_TIMEOUT_REQUISICAO = "15"          # cada pedido HTTP
WEB_CACHE_TTL_PAGINAS_HORAS = "24"
WEB_CACHE_TTL_BUSCAS_HORAS = "6"
WEB_CACHE_MAX_MB = "200"
WEB_MAX_PAGINA_MB = "2"                # lido da página (acima disso, só o começo)
WEB_MAX_TEXTO_BYTES = "40000"          # texto por resposta; o resto vem em partes
WEB_INTERVALO_DOMINIO_SEGUNDOS = "2"   # ou o Crawl-delay do site, se maior

[[mcp.servidores]]
# ambiente: como está a máquina, só leitura. Serviços do systemd da lista
# abaixo e o diário deles, disco, memória, processos que mais usam memória e
# portas abertas. Nada muda o sistema, nada usa sudo e o servidor não roda
# como root. Para ler o diário, o usuário do daemon precisa do grupo adm ou
# systemd-journal (o ubuntu do cloud-init costuma já vir no adm).
nome = "ambiente"
comando = "uv"
args = ["run", "--frozen", "--quiet", "--no-dev", "servidor.py"]
diretorio = "recursos/mcp/ambiente"
timeout_segundos = 30
ativo = true

[mcp.servidores.env]
# Só estas unidades podem ser vistas (sem sufixo = .service).
AMBIENTE_SERVICOS = "abiyss.service, docker.service"
AMBIENTE_MAX_LINHAS_DIARIO = "100"
AMBIENTE_TIMEOUT_COMANDO = "10"        # systemctl/journalctl; + 5 s ≤ timeout_segundos
AMBIENTE_MAX_BYTES = "30000"           # por resposta (o diário guarda as linhas mais novas)

# ---------------------------------------------------------------------------
# Banco (SQLite).
# ---------------------------------------------------------------------------

[banco]
# Teto do cache de páginas da conexão do daemon, em KiB. É a maior parte da
# memória do daemon que cresce com o banco; acima disso o SQLite relê do disco
# (o sistema operacional também guarda o arquivo em cache).
cache_kib = 2048

# ---------------------------------------------------------------------------
# Retenção e manutenção do banco (feita pelo daemon; `abiyss manutencao`
# roda na hora). Detalhe mais velho que N dias vira agregado diário (dia
# UTC) e é apagado: chamadas_modelo → chamadas_modelo_diarias, eventos JÁ
# consumidos → eventos_diarios (pendentes nunca são apagados), ciclos →
# ciclos_diarios, mensagens do gateway já terminadas → gateway_mensagens_diarias
# (as da fila e as ligadas a um pedido pendente ficam). Mínimo de 2 dias (status e interocepção leem as últimas 24 h).
# ---------------------------------------------------------------------------

[retencao]
chamadas_modelo_dias = 30
eventos_dias = 30
ciclos_dias = 30
gateway_dias = 30
# Retenção + vacuum incremental.
manutencao_minutos = 360
# Checkpoint do WAL (o arquivo -wal é truncado; teto de 64 MiB entre checkpoints).
checkpoint_minutos = 15
vacuum_max_paginas = 2000
# Bancos criados antes desta versão precisam de UM VACUUM completo para
# ligar o vacuum incremental; o daemon faz isso sozinho na 1ª manutenção.
converter_auto_vacuum = true
