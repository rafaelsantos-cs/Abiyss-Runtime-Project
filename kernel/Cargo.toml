[package]
name = "abiyss"
version = "0.1.0"
edition = "2024"
description = "Kernel do Abiyss: agente de IA autônomo 24/7"
publish = false

[lib]
name = "abiyss"
path = "src/lib.rs"

[[bin]]
name = "abiyss"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
# Expressões cron (5 campos, padrão Unix).
croner = "4"
dotenvy = "0.15"
fastrand = "2"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
# SDK oficial do MCP em Rust: só a parte de CLIENTE com transporte por processo filho.
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
# "bundled": compila o SQLite junto, sem depender da versão instalada na VM.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CPU, memória e disco para a interocepção (só o necessário).
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
