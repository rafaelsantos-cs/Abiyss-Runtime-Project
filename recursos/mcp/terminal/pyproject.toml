[project]
name = "abiyss-mcp-terminal"
version = "0.1.0"
description = "Servidor MCP terminal do Abiyss: comandos de shell numa caixa de areia (bubblewrap)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[dependency-groups]
# Só para os testes (`uv run pytest`). O kernel sobe com `--no-dev`.
dev = [
    "pytest>=8",
]

[tool.uv]
# Não é um pacote instalável: só um script com dependências.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
